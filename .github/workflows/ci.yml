name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest SDK the package supports that CI can run, and the latest.
        sdk: [2.19.6, stable]
    steps:
      - uses: actions/checkout@v7
      # The Go-server tests build the unitdb server from source.
      - uses: actions/checkout@v7
        with:
          repository: unit-io/unitdb
          path: unitdb-server
      - uses: actions/setup-go@v7
        with:
          go-version-file: unitdb-server/go.mod
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --no-fatal-warnings lib test
      - run: dart test
        env:
          UNITDB_E2E_GO: '1'
          UNITDB_SERVER_DIR: ${{ github.workspace }}/unitdb-server/server
