version: 2
updates:
  # One pull request a week for the package's dependencies with an update,
  # so that they are tested together.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub-dependencies:
        patterns: ["*"]
    # Major versions need Dart 3, above the SDK floor.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
